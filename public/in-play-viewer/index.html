<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In-Play Viewer</title>
    <link rel="stylesheet" href="/in-play-viewer/styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="topbar">
        <h1>In-Play Viewer</h1>
        <p>Visualize detected in-play ranges only.</p>
      </header>

      <section class="controls">
        <label for="apiBase">API Base</label>
        <input id="apiBase" type="text" placeholder="http://localhost:3000" />

        <label for="runId">In-Play Run ID</label>
        <input id="runId" type="text" placeholder="paste in-play run id" />

        <label for="symbol">Symbol</label>
        <input id="symbol" type="text" placeholder="BTCUSDT" />
        <label for="initialBalance">Initial Balance</label>
        <input id="initialBalance" type="number" min="1" step="1" value="10000" />
        <label for="riskPercent">Risk %</label>
        <input id="riskPercent" type="number" min="0.0001" step="0.1" value="2" />
        <label for="rewardRatio">Reward Ratio</label>
        <input id="rewardRatio" type="number" min="0.0001" step="0.1" value="2" />
        <label for="minFvgSizePercent">Min FVG %</label>
        <input id="minFvgSizePercent" type="number" min="0" step="0.1" value="0.8" />
        <label for="maxFvgSizePercent">Max FVG %</label>
        <input id="maxFvgSizePercent" type="number" min="0" step="0.1" value="4" />

        <button id="loadBtn" type="button">Load In-Play</button>
        <button id="generateWindowsBtn" type="button">Generate Entry Windows</button>
        <button id="runBacktestBtn" type="button">Run In-Play Backtest</button>
        <label for="showEntryBands">Show Entry Bands</label>
        <input id="showEntryBands" type="checkbox" checked />
        <label for="showEntryMarkers">Show Entry Markers</label>
        <input id="showEntryMarkers" type="checkbox" checked />
      </section>

      <section class="stats" id="stats"></section>

      <section class="chart-wrap">
        <div id="chart"></div>
      </section>

      <section class="ranges-wrap">
        <h2>Ranges</h2>
        <div id="ranges"></div>
      </section>

      <section class="ranges-wrap">
        <h2>FVG Zones</h2>
        <div id="zones"></div>
      </section>

      <section class="ranges-wrap">
        <h2>Entry Windows</h2>
        <div id="entryWindows"></div>
      </section>

      <section class="ranges-wrap">
        <h2>In-Play Backtest</h2>
        <div id="backtestResult"><p>No backtest executed yet.</p></div>
      </section>
    </main>

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/in-play-viewer/app.js"></script>
  </body>
  </html>
